[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_functions = test_*
# --strict-markers: an unregistered mark (e.g. a would-be "integration" test)
# is an error. Tests never use real infrastructure or external services.
addopts = --cov=app --cov-fail-under=60 --strict-markers
markers =
    unit: unit tests
    api: API tests
